name: Isolated application and backup integration

on:
  pull_request:
    paths:
      - 'scripts/test-mongodb-roundtrip.sh'
      - 'scripts/mongo-backup.cjs'
      - 'server/**'
      - 'client/**'
      - '.github/workflows/integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mongo-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies for live API test
        run: npm ci --prefix server --legacy-peer-deps
      - name: MongoDB recovery and live API test on disposable Docker volumes
        run: bash scripts/test-mongodb-roundtrip.sh

  application-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server --legacy-peer-deps
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Verify GraphQL schema and queries
        run: node scripts/test-graphql-contract.cjs
      - name: Build React application
        run: npm run build --prefix client
        env:
          CI: 'true'
